<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>志愿者系统 - 注册</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container" style="max-width:520px; margin-top:40px;">
    <h2 style="text-align:center; margin-bottom:20px;">注册新用户</h2>

    <form id="registerForm" onsubmit="return false;">
      <div class="form-group">
        <label>姓名 <span style="color:#c0392b">*</span></label>
        <input type="text" id="pname" placeholder="请输入姓名" required>
      </div>

      <div class="form-group">
        <label>学号 <span style="color:#c0392b">*</span></label>
        <input type="text" id="school_id" placeholder="请输入学号" required>
      </div>

      <div class="form-group">
        <label>密码 <span style="color:#c0392b">*</span></label>
        <input type="password" id="password" placeholder="请输入密码" required>
      </div>

      <div class="form-group">
        <label>确认密码 <span style="color:#c0392b">*</span></label>
        <input type="password" id="confirm_password" placeholder="请再次输入密码" required>
      </div>

      <div class="form-group">
        <label>学院</label>
        <input type="text" id="college" placeholder="学院名称">
      </div>

      <div class="form-group">
        <label>志愿者号</label>
        <input type="text" id="voluntary_id" placeholder="如未知可留空">
      </div>

      <div class="form-group">
        <label>政治身份</label>
        <select id="political_status">
          <option value="群众">群众</option>
          <option value="共青团员">共青团员</option>
          <option value="积极分子">积极分子</option>
          <option value="发展对象">发展对象</option>
          <option value="预备党员">预备党员</option>
          <option value="中共党员">中共党员</option>
        </select>
      </div>

      <div class="form-group">
        <label>手机号 <span style="color:#c0392b">*</span></label>
        <input type="tel" id="phone_number" placeholder="11 位手机号" required>
      </div>

      <div class="form-group">
        <label>性别</label>
        <select id="gender">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>

      <div class="form-group">
        <label>年级</label>
        <select id="grade">
          <option value="2022">2022级</option>
          <option value="2023">2023级</option>
          <option value="2024">2024级</option>
          <option value="2025">2025级</option>
        </select>
      </div>

      <div class="form-group">
        <label>教育背景</label>
        <select id="edu_background">
          <option value="本科">本科</option>
          <option value="研究生">研究生</option>
        </select>
      </div>

      <div style="margin-top:14px;">
        <button type="button" onclick="register()">立即注册</button>
      </div>

      <div class="switch" style="margin-top:12px; text-align:center;">
        <p>已有账号？ <a href="login.html">去登录</a></p>
      </div>
    </form>
  </div>

  <!-- 全局 config.js 必须先加载 -->
  <script src="js/config.js"></script>
  <!-- 注册逻辑 -->
  <script src="js/register.js"></script>

</body>

</html>
