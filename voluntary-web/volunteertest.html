<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>志愿者资格测试</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei";
            background: #f7f7f7;
        }

        /* 顶部固定导航栏 */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #3498db;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 999;
        }

        #title {
            font-size: 20px;
            font-weight: bold;
        }

        #timer {
            font-size: 18px;
        }

        #submitBtn {
            padding: 8px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        /* 内容区 */
        #content {
            margin-top: 80px;
            padding: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .question {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        .options label {
            display: block;
            padding: 4px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div id="title">志愿者资格测试（100题）</div>
        <div id="timer">考试时间：60:00</div>
        <button id="submitBtn">交卷</button>
    </div>

    <div id="content">
        <div id="questionContainer"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/voltest.js"></script>
</body>

</html>
