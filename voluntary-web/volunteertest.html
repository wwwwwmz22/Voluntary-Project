<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>志愿者资格测试</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei";
            background: #f7f7f7;
        }

        /* 顶部固定导航栏 */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
        }

        #title {
            margin: 0;
            font-size: 1.5em;
        }

        #timer {
            font-size: 18px;
            white-space: nowrap;
            position: center;
        }

        #submitBtn {
            padding: 6px 12px;
            background: #e74c3c;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            border: none;
            color: white;
            cursor: pointer;
        }

        #submitBtn:hover {
            background: #c0392b;
        }

        /* 内容区 */
        #content {
            margin-top: 90px;
            padding: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .question {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }

        .options label {
            display: block;
            padding: 4px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div id="title">志愿者资格测试（100题）</div>
        <div id="timer">考试时间：60:00</div>
        <button id="submitBtn">交卷</button>
    </div>

    <div id="content">
        <div id="questionContainer"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/voltest.js"></script>
</body>

</html>
