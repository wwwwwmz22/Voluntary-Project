<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志愿者报名</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------------- header ---------------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #3498db;
      color: white;
      font-size: 1.2rem;
    }

    .top-buttons button {
      margin-left: 10px;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .back-btn {
      background-color: #2980b9;
      color: white;
    }

    /* ---------------- 容器 ---------------- */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 10px;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    .form-group label {
      margin-right: 10px;
      min-width: 80px;
    }

    .form-group input[type="date"] {
      flex: 1;
      padding: 5px 8px;
      font-size: 1rem;
      margin-right: 10px;
    }

    .form-group button {
      padding: 5px 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
    }

    /* ---------------- 表格 ---------------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #3498db;
      /* 表头固定颜色 */
    }

    /* ---------------- 状态颜色 ---------------- */
    .full {
      color: red;
      font-weight: bold;
    }

    /* 状态颜色样式 */
    .available {
      color: orange;
      font-weight: bold;
    }

    .registered {
      color: blue;
      font-weight: bold;
    }

    .full {
      color: red;
      font-weight: bold;
    }

    .past {
      color: #aaa;
      font-weight: normal;
    }

    /* ---------------- 按钮状态 ---------------- */
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .full-btn {
      background-color: #ff4d4d !important;
      color: white;
      border: none;
    }

    .full-btn:hover {
      background-color: #ff3333 !important;
    }

    /* ---------------- 响应式 ---------------- */
    @media (max-width: 768px) {

      th,
      td {
        font-size: 0.85rem;
        padding: 6px;
      }

      .form-group {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-group input,
      .form-group button {
        width: 100%;
        margin: 5px 0;
      }

      .top-buttons {
        display: flex;
        flex-direction: column;
      }

      .top-buttons button {
        margin: 5px 0 0 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>志愿者报名</div>
    <div class="top-buttons">
      <button class="back-btn" onclick="window.history.back()">返回上一页</button>
    </div>
  </header>

  <div class="container">
    <div class="form-group">
      <label for="qdate">选择日期：</label>
      <input type="date" id="qdate">
      <button onclick="loadDutyInfo()">查询</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>时间段</th>
          <th>已报名人数</th>
          <th>剩余名额</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="duty_table_body"></tbody>
    </table>
  </div>

  <script src="js/config.js"></script>
  <script src="js/signup.js"></script>
  <script>
    const dateInput = document.getElementById("qdate");
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const minDate = `${yyyy}-${mm}-${dd}`;
    const maxDateObj = new Date(today);
    maxDateObj.setDate(today.getDate() + 7);
    const maxDate = `${maxDateObj.getFullYear()}-${String(maxDateObj.getMonth() + 1).padStart(2, '0')}-${String(maxDateObj.getDate()).padStart(2, '0')}`;
    dateInput.min = minDate;
    dateInput.max = maxDate;
    dateInput.value = minDate;

    // 判断时间段是否已过（根据开始时间）
    function isPastSlot(slot, qdate) {
      const now = new Date();
      const slotStart = new Date(`${qdate}T${slot[0]}:00`);
      return now >= slotStart;
    }

    // 页面加载默认显示当天报名信息
    document.addEventListener("DOMContentLoaded", () => {
      loadDutyInfo();
    });
  </script>
</body>

</html>
