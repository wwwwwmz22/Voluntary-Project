<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>修改个人信息</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>修改个人信息</h1>
  </header>

  <div class="container">
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="edit_pname">
    </div>

    <div class="form-group">
      <label>学号（不可修改）</label>
      <input type="text" id="edit_school_id" disabled>
    </div>

    <div class="form-group">
      <label>学院</label>
      <input type="text" id="edit_college">
    </div>

    <div class="form-group">
      <label>志愿者号</label>
      <input type="text" id="edit_voluntary_id">
    </div>

    <div class="form-group">
      <label>政治面貌</label>
      <input type="text" id="edit_political_status" placeholder="如：共青团员、群众等">
    </div>

    <div class="form-group">
      <label>手机号</label>
      <input type="text" id="edit_phone_number">
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" id="edit_password" placeholder="如不修改可留空">
    </div>

    <div class="form-group">
      <label>年级</label>
      <input type="text" id="edit_grade">
    </div>

    <div class="form-group">
      <label>教育背景</label>
      <input type="text" id="edit_education">
    </div>

    <button onclick="saveProfile()">保存修改</button>
    <button style="margin-top:10px; background-color:#888;" onclick="window.location.href='profile.html'">返回</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/profile_edit.js"></script>
</body>

</html>
