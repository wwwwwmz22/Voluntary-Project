<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>志愿者系统 - 登录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container" style="max-width:420px; margin-top:80px;">
    <h2 style="text-align:center; margin-bottom:18px;">登录系统</h2>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label>学号</label>
        <input type="text" id="school_id_login" placeholder="请输入学号" required>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password_login" placeholder="请输入密码" required>
      </div>

      <div style="margin-top:12px;">
        <button type="button" onclick="login()">登录</button>
      </div>

      <div class="switch" style="margin-top:12px; text-align:center;">
        <p>没有账号？ <a href="register.html">去注册</a></p>
      </div>
    </form>
  </div>

  <!-- 全局 config.js 必须先加载 -->
  <script src="js/config.js"></script>
  <!-- 认证脚本 -->
  <script src="js/auth.js"></script>
</body>

</html>
